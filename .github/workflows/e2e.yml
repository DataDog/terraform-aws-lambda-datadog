name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Path filter: only run the (slow, cloud-touching) e2e job when the module or the
  # suite itself changes. The live run is additionally gated on AWS OIDC federation being
  # configured (the AWS_ROLE_ARN_E2E repo variable), so the job is green until an admin
  # wires up federation + secrets, and runs for real once they do.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            lambda:
              - 'main.tf'
              - 'variables.tf'
              - 'outputs.tf'
              - 'versions.tf'
              - 'e2e/**'
              - '.github/workflows/e2e.yml'
      - id: gate
        env:
          CHANGED: ${{ steps.filter.outputs.lambda }}
          FEDERATION_CONFIGURED: ${{ vars.AWS_ROLE_ARN_E2E != '' }}
        run: |
          if [ "$CHANGED" = "true" ] && [ "$FEDERATION_CONFIGURED" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping live e2e: changed=$CHANGED federation_configured=$FEDERATION_CONFIGURED"
          fi

  e2e-test:
    name: Lambda instrumentation lifecycle
    runs-on: ubuntu-latest
    needs: [changes]
    # OIDC federation to AWS; never long-lived keys.
    permissions:
      contents: read
      id-token: write
    env:
      SKIP_LAMBDA_TESTS: ${{ needs.changes.outputs.should_run != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum

      - name: Set up Terraform
        if: needs.changes.outputs.should_run == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      # Short-lived Datadog API + App keys via OIDC federation (dd-sts), governed by the
      # policy in dd-source (config/policies/.../terraform-aws-lambda-datadog-e2e.yaml).
      # No static Datadog keys are stored in this repo.
      - name: Get Datadog credentials (dd-sts)
        id: dd-sts
        if: needs.changes.outputs.should_run == 'true'
        uses: DataDog/dd-sts-action@2e8187910199bd93129520183c093e19aa585c75 # v1.0.0
        with:
          policy: terraform-aws-lambda-datadog-e2e

      - name: Configure AWS credentials (OIDC)
        if: needs.changes.outputs.should_run == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_E2E }}
          aws-region: ${{ vars.AWS_REGION_E2E }}

      # Seed the workload's API key secret (read by the Lambda extension) with the
      # dd-sts-issued key, so the workload ships to the same org the suite queries.
      - name: Seed workload Datadog API key
        if: needs.changes.outputs.should_run == 'true'
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
        run: |
          aws secretsmanager put-secret-value \
            --secret-id "${{ vars.DD_API_KEY_SECRET_ARN_E2E }}" \
            --secret-string "$DD_API_KEY" \
            --region "${{ vars.AWS_REGION_E2E }}" >/dev/null

      - name: Run e2e suite
        working-directory: e2e
        run: go test -v -timeout 45m .
        env:
          AWS_REGION: ${{ vars.AWS_REGION_E2E }}
          DD_API_KEY_SECRET_ARN: ${{ vars.DD_API_KEY_SECRET_ARN_E2E }}
          DATADOG_SITE: ${{ vars.DATADOG_SITE_E2E }}
          DATADOG_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
          DATADOG_APP_KEY: ${{ steps.dd-sts.outputs.app_key }}
          # Pin artifacts so a telemetry failure blames the module, not upstream.
          DD_NODE_LAYER_VERSION: ${{ vars.DD_NODE_LAYER_VERSION_E2E }}
          DD_EXTENSION_LAYER_VERSION: ${{ vars.DD_EXTENSION_LAYER_VERSION_E2E }}
