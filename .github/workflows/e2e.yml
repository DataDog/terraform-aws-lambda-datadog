name: e2e

# Full instrumentation lifecycle against a live Lambda function.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '*.tf'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - '*.tf'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e-test:
    name: Lambda instrumentation lifecycle
    # Fork pull requests can't use this repository's OIDC role.
    if: >-
      github.repository == 'DataDog/terraform-aws-lambda-datadog' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      # Short-lived Datadog API + App keys via OIDC federation (dd-sts), governed by the
      # policy in dd-source (config/policies/.../terraform-aws-lambda-datadog-e2e.yaml).
      - name: Get Datadog credentials (dd-sts)
        id: dd-sts
        uses: DataDog/dd-sts-action@2e8187910199bd93129520183c093e19aa585c75 # v1.0.0
        with:
          policy: terraform-aws-lambda-datadog-e2e

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_E2E }}
          aws-region: ${{ vars.AWS_REGION_E2E }}

      # Seed the workload's API key secret (read by the Lambda extension) with the
      # dd-sts-issued key, so the workload ships to the same org the suite queries.
      - name: Seed workload Datadog API key
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
        run: |
          aws secretsmanager put-secret-value \
            --secret-id "${{ vars.DD_API_KEY_SECRET_ARN_E2E }}" \
            --secret-string "$DD_API_KEY" >/dev/null

      - name: Set run ID
        run: echo "E2E_RUN_ID=$(openssl rand -hex 4)" >> "$GITHUB_ENV"

      - name: Run e2e suite
        working-directory: e2e
        # -p 1 streams -v output as tests run, across multiple packages.
        run: go test -count=1 -v -p 1 -timeout 40m ./...
        env:
          DD_API_KEY_SECRET_ARN: ${{ vars.DD_API_KEY_SECRET_ARN_E2E }}
          DD_SITE: ${{ vars.DATADOG_SITE_E2E || 'datadoghq.com' }}
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
          DD_APP_KEY: ${{ steps.dd-sts.outputs.app_key }}
          # Pin artifacts so a telemetry failure blames the module, not upstream.
          DD_NODE_LAYER_VERSION: ${{ vars.DD_NODE_LAYER_VERSION_E2E }}
          DD_EXTENSION_LAYER_VERSION: ${{ vars.DD_EXTENSION_LAYER_VERSION_E2E }}

      # Catches resources left behind when the test times out or the run is cancelled.
      - name: Delete leftover resources
        if: always() && env.E2E_RUN_ID != ''
        run: |
          name="one-e2e-tf-lambda-$E2E_RUN_ID"
          role="$name-role"
          if aws lambda get-function --function-name "$name" >/dev/null 2>&1; then
            aws lambda delete-function --function-name "$name"
          fi
          if aws iam get-role --role-name "$role" >/dev/null 2>&1; then
            aws iam detach-role-policy --role-name "$role" \
              --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole || true
            aws iam delete-role-policy --role-name "$role" --policy-name read-dd-api-key-secret || true
            aws iam delete-role --role-name "$role"
          fi
